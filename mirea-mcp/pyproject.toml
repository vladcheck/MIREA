[project]
name = "mirea-mcp"
version = "0.1.0"
description = "MCP-сервер для данных РТУ МИРЭА: СДО (Moodle) и Пульс (pulse.mirea.ru)"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0",
    "pymirea>=0.5.1",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "python-dotenv>=1.0",
    "flake8>=7.5.0",
]

[project.scripts]
mirea-mcp = "mirea_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mirea_mcp"]

[tool.ruff]
line-length = 88
# Assume a modern Python version for rule targeting
target-version = "py310"
extend-exclude = [
    ".git",
    "__pycache__",
    "docs/source/conf.py",
    "old",
    "build",
    "dist",
    ".venv",
]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort (import sorting)
    "B",  # flake8-bugbear
    "UP", # pyupgrade
]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
