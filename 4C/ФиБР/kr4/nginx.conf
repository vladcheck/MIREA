events {
    worker_connections 1024;
}

http {
    upstream postgres_backends {
        least_conn;
        server pg-app1:3000 max_fails=2 fail_timeout=30s;
        server pg-app2:3000 max_fails=2 fail_timeout=30s;
        server pg-app3:3000 max_fails=2 fail_timeout=30s backup;
    }

    upstream mongodb_backends {
        least_conn;
        server mongo-app1:3000 max_fails=2 fail_timeout=30s;
        server mongo-app2:3000 max_fails=2 fail_timeout=30s;
        server mongo-app3:3000 max_fails=2 fail_timeout=30s backup;
    }

    server {
        listen 80;

        location /pg {
            proxy_pass http://postgres_backends;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /mongo {
            proxy_pass http://mongodb_backends;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }
    }
}
