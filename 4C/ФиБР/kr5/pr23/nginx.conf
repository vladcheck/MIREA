events {
    worker_connections 1024;
}

http {
    upstream backend {
        server app1:3000 max_fails=2 fail_timeout=30s;
        server app2:3000 max_fails=2 fail_timeout=30s;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /health {
            access_log off;
            proxy_pass http://backend;
        }
    }
}