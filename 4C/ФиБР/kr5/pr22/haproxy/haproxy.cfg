global
    log stdout format raw local0

defaults
    mode http
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend http_front
    bind *:80
    default_backend http_back

backend http_back
    balance roundrobin

    option httpchk GET /health

    server app1 app1:3000 check fall 3 rise 2
    server app2 app2:3001 check fall 3 rise 2