[project]
name = "maths-for-programming-5c"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "matplotlib>=3.11.1",
    "nbformat>=5.11.1",
    "numpy>=2.5.3",
    "pypdf>=6.18.0",
    "scipy>=1.18.1",
    "sympy>=1.14.0",
]

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "ipykernel>=7.3.0",
    "nbclient>=0.11.0",
    "nbconvert>=7.17.1",
    "playwright>=1.63.0",
]
