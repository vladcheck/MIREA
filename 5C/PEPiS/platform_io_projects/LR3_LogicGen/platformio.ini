; Платформа: STM32F407VGT6 (учебный стенд DIS_F407VG)
; Дисциплина: Программирование электронных приборов и систем
; ЛР №3. Генератор логических уровней

[env:dis_f407vg]
platform = ststm32
board = genericSTM32F407VGT6
framework = stm32cube

upload_protocol = stlink

; Fallback: если OpenOCD не видит стенд, прошивка утилитой st-flash:
; upload_protocol = custom
; upload_command = st-flash write $SOURCE 0x8000000
