; Lab #2: семисегментный индикатор — STM32F407VGT6 (Discovery board)
; Вариант 4: статическая цифра «4», динамический год 2026 <-> 2005, точка, счётчик секунд.
; Плата disco_f407vg, фреймворк stm32cube, прямой доступ к регистрам (CMSIS).
; Каждое окружение компилирует ровно один файл main_*.c через build_src_filter.
;
;   pio run -e static    -> src/main_static.c   (статическая индикация цифры 4)
;   pio run -e dynamic   -> src/main_dynamic.c  (динамическая индикация года 2026)
;   pio run -e switch    -> src/main_switch.c   (задание 5.1: переключение 2026 <-> 2005 по PB0)
;   pio run -e dot       -> src/main_dot.c      (задание 5.2: точка dp во втором разряде)
;   pio run -e counter   -> src/main_counter.c  (задание 5.3: счётчик секунд 0-9999)

[platformio]
default_envs = static

[env:static]
platform = ststm32
board = disco_f407vg
framework = stm32cube
build_src_filter = -<*> +<main_static.c>

[env:dynamic]
platform = ststm32
board = disco_f407vg
framework = stm32cube
build_src_filter = -<*> +<main_dynamic.c>

[env:switch]
platform = ststm32
board = disco_f407vg
framework = stm32cube
build_src_filter = -<*> +<main_switch.c>

[env:dot]
platform = ststm32
board = disco_f407vg
framework = stm32cube
build_src_filter = -<*> +<main_dot.c>

[env:counter]
platform = ststm32
board = disco_f407vg
framework = stm32cube
build_src_filter = -<*> +<main_counter.c>
