; Практическая работа № 4 «Организация последовательного обмена данными
; в микроконтроллерной системе» (пр7-8, Proteus 8.17).
; Целевой МК: STM32F103C8, фреймворк CMSIS (подключение регистров вручную).
;
; Сборка:
;   pio run -e pr78_example    -> .pio/build/pr78_example/firmware.{elf,hex}
;   pio run -e pr78_variant4   -> .pio/build/pr78_variant4/firmware.{elf,hex}
; Полученный .elf (предпочтительно) или .hex указывается в поле
; Program File модели STM32F103C8 в Proteus.
;
; Тактовая частота в программе задаётся вручную: HSI 8 МГц без PLL,
; PCLK2 = 8 МГц (см. Clock_Init_HSI8MHz), поэтому f_cpu платы
; переопределяется на 8 МГц.

[platformio]
src_dir = src

[env]
platform = ststm32
board = genericSTM32F103C8
framework = cmsis
board_build.f_cpu = 8000000L
extra_scripts = post:tools/pio_make_hex.py

[env:pr78_example]
; Учебный пример (листинг 9.5): блокирующий опрос, 9600 8N1.
build_src_filter = -<*> +<main_example.c>

[env:pr78_variant4]
; Индивидуальный вариант 4: приём по прерыванию, 19200 8N1.
build_src_filter = -<*> +<main_variant4.c>
