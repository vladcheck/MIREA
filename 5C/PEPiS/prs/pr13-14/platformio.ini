; Практическое занятие 13-14 «Изучение принципов работы аналого-цифровых
; преобразователей» (лабораторная работа № 7 методички).
; Целевой МК: AT89C51 (МК-51, ядро 8051), компилятор SDCC.
;
; Сборка:
;   pio run -e pr1314_example    -> .pio/build/pr1314_example/firmware.{elf,hex}
;   pio run -e pr1314_variant4   -> .pio/build/pr1314_variant4/firmware.{elf,hex}
; Полученный .hex указывается в поле Program File модели МК-51
; в схеме Proteus (см. kicad/mcu_connection.kicad_sch).

[platformio]
src_dir = src

[env]
platform = intel_mcs51
board = AT89C51

[env:pr1314_example]
; Учебный пример (п. 2 задание 2 методички): 8-разрядный АЦП,
; Vref+ = +5 В, uвх = +1 В, ожидаемый код пробников 51.
build_src_filter = -<*> +<main_example.c>

[env:pr1314_variant4]
; Индивидуальный вариант 4 (табл. 18): 16-разрядный АЦП,
; Vref+ = +5 В, Vref- = 0 В, съём кода с ожиданием EOC.
build_src_filter = -<*> +<main_variant4.c>
