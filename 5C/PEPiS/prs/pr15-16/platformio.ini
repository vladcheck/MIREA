; Практическая работа № 15-16 «Исследование широтно-импульсной модуляции,
; реализованной микроконтроллером МК-52» (8052-совместимый, Intel MCS-51).
; Компилятор: SDCC через платформу intel_mcs51.
;
; Сборка прошивок:
;   pio run -e pr1516_example   -> .pio/build/pr1516_example/firmware.{ihx,hex}
;   pio run -e pr1516_variant4  -> .pio/build/pr1516_variant4/firmware.{ihx,hex}
; Полученный .hex указывается в поле Program File (Clock Frequency)
; модели МК-52 (8052) в среде схемного моделирования.
;
; Проверка синтаксиса без тулчейна SDCC:
;   clang -fsyntax-only -Wall -Wextra -I tools/include src/main_example.c
;   clang -fsyntax-only -Wall -Wextra -I tools/include src/main_variant4.c
; (в этом режиме подключается заглушка tools/include/8052.h).

[platformio]
src_dir = src

[env]
platform = intel_mcs51
board = Generic8052
extra_scripts = post:tools/pio_make_hex.py

[env:pr1516_example]
; Учебный пример: кварц 11,0592 МГц, RCAP2 = 0x0000, tmpCnt = 4000.
build_src_filter = -<*> +<main_example.c>

[env:pr1516_variant4]
; Вариант 4: кварц 13 МГц, RCAP2 = 0x0218, tmpCnt = 48750 (Q = 75 %).
build_src_filter = -<*> +<main_variant4.c>
