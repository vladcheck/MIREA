; Практическая работа № 5 «Отображение информации в
; микроконтроллерных системах» (пр9-10, Proteus 8.17).
; Целевые МК: STM32F103C8 (сборка ниже) и ATmega32 (источники
; main_example_avr.c / main_variant4_avr.c собираются GCC for AVR
; из среды ATmega32 или интегрированным компилятором Proteus).
;
; Сборка:
;   pio run -e pr910_example   -> .pio/build/pr910_example/firmware.{elf,hex}
;   pio run -e pr910_variant4  -> .pio/build/pr910_variant4/firmware.{elf,hex}
; Полученный .elf (предпочтительно) или .hex указывается в поле
; Program File модели STM32F103C8 в Proteus.
;
; Тактовая частота в программе задаётся вручную: HSI 8 МГц без PLL,
; APB1/APB2 без делителей (TIM2CLK = PCLK1 = 8 МГц), поэтому f_cpu
; платы переопределяется на 8 МГц.

[platformio]
src_dir = src

[env]
platform = ststm32
board = genericSTM32F103C8
framework = cmsis
board_build.f_cpu = 8000000L

[env:pr910_example]
; Учебный пример (листинг 9.13): статический вывод цифры 5.
build_src_filter = -<*> +<main_example_stm32.c>

[env:pr910_variant4]
; Индивидуальный вариант 4: цифры 9-8-7-6, обратный порядок,
; T_симв = 400 мс по событию TIM2.
build_src_filter = -<*> +<main_variant4_stm32.c>
