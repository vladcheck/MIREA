; Практическая работа № 11-12 «Исследование цифро-аналогового
; преобразования на матрице R-2R» (учебная работа № 6, Proteus 8.17).
; Целевой МК: STM32F103C8, фреймворк CMSIS (подключение регистров вручную).
;
; Сборка:
;   pio run -e pr1112_example   -> .pio/build/pr1112_example/firmware.{elf,hex}
;   pio run -e pr1112_variant4  -> .pio/build/pr1112_variant4/firmware.{elf,hex}
; Полученный .elf (предпочтительно) или .hex указывается в поле
; Program File модели STM32F103C8 в Proteus.
;
; Тактовая частота в программе задаётся вручную: HSI 8 МГц без PLL,
; поэтому f_cpu платы переопределяется на 8 МГц.

[platformio]
src_dir = src

[env]
platform = ststm32
board = genericSTM32F103C8
framework = cmsis
board_build.f_cpu = 8000000L
extra_scripts = post:tools/pio_make_hex.py

[env:pr1112_example]
; Учебный пример (листинг 9.17): постоянный код, затем общая часть
; с последовательной выдачей кодов 0, 64, 128, 192, 255.
build_src_filter = -<*> +<main_example.c>

[env:pr1112_variant4]
; Индивидуальный вариант 4: коды 76, 133, 207 и пила с шагом 10 мс.
build_src_filter = -<*> +<main_variant4.c>
