; Лабораторная работа № 4 (редакция v2): матричная клавиатура 4x4 + GLCD 128x64.
; Стенд МПСУ-Ш-МН, ATmega32, 8 МГц, язык Си (avr-gcc, avr-libc), без Arduino.
;
;   pio run -e ATmega32 -> src/main.c      (основная программа, листинг 2)
;   pio run -e 11a      -> src/11a_main.c  (задание 11а: C очищает только KEY)
;   pio run -e 11b      -> src/11b_main.c  (задание 11б: D добавляет «-» в BUF)
;   pio run -e 11c      -> src/11c_main.c  (задание 11в: счётчик нажатий 0-99)
;   pio run -e 11d      -> src/11d_main.c  (задание 11г: BUF максимум 10, FULL)
;
; Прошивка: pio run -e <env> -t upload
; Встроенный программатор стенда — классический AVR JTAG ICE (serial) через FT232R.

[platformio]
default_envs = ATmega32, 11a, 11b, 11c, 11d

[env]
platform = atmelavr
board = ATmega32
board_build.f_cpu = 8000000L
build_flags =
  -Wall
  -Wextra
; Классический AVR JTAG ICE (serial) через FT232R USB-UART.
upload_protocol = custom
upload_command = $PROJECT_PACKAGES_DIR/tool-avrdude/bin/avrdude -C $PROJECT_PACKAGES_DIR/tool-avrdude/avrdude.conf -p m32 -c jtagmkI -P /dev/cu.usbserial-AK073CXM -b 115200 -U flash:w:$SOURCE:i

[env:ATmega32]
build_src_filter = -<*> +<main.c>

[env:11a]
build_src_filter = -<*> +<11a_main.c>

[env:11b]
build_src_filter = -<*> +<11b_main.c>

[env:11c]
build_src_filter = -<*> +<11c_main.c>

[env:11d]
build_src_filter = -<*> +<11d_main.c>
