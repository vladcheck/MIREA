; Lab #4: стенд МПСУ-Ш-МН, ATmega32, язык Си (avr-gcc, avr-libc).
; Учебные примеры из методички + задачи индивидуального варианта 4.
; Тактирование 8 МГц (внешний кварц стенда).
;
;   pio run -e example1  -> src/main_example1.c  (учебный пример 1: PA2 -> PD=0xF0/0x0F)
;   pio run -e example2  -> src/main_example2.c  (учебный пример 2: бегущий огонь на PD)
;   pio run -e task2      -> src/main_task2_pb0.c (задача 2: PB0 -> два младших/старших бита PC)
;   pio run -e variant4   -> src/main_variant4.c  (задача 3, вариант 4: PD2:PD1 -> PD4-PD7)
;   pio run -e or4        -> src/main_or4.c       (задача 4г: элемент 4ИЛИ)
;   pio run -e jk         -> src/main_jk.c        (задача 5г: JK-триггер)
;   pio run -e pa2pd       -> src/main_pa2pd.c     (задача 6: число с PA в PD)
;   pio run -e twoscomp    -> src/main_twoscomp.c  (задача 7г: дополнительный код в PC)
;   pio run -e and         -> src/main_and.c       (задача 8г: И двух тетрад в PD)
;   pio run -e traffic     -> src/main_traffic.c   (задача 12: светофор PD1-PD3)
;   pio run -e accum       -> src/main_accum.c     (задача 13: бегущий огонь с накоплением)
;   pio run -e inverse     -> src/main_inverse.c   (задача 14: инверсный бегущий огонь)
;   pio run -e delay_half  -> src/main_delay_half.c (задача 10а: задержка вдвое меньше)
;   pio run -e delay_x4    -> src/main_delay_x4.c   (задача 10б: задержка вчетверо больше)
;   pio run -e delay_05s   -> src/main_delay_05s.c  (задача 11г, вариант 4: переключение каждые 0,5 с)

[platformio]
default_envs = example1, example2, task2, variant4, or4, jk, pa2pd, twoscomp, and, traffic, accum, inverse, delay_half, delay_x4, delay_05s

[env]
platform = atmelavr
board = ATmega32
board_build.f_cpu = 8000000L
build_flags =
  -Wall
  -Wextra

[env:example1]
build_src_filter = -<*> +<main_example1.c>

[env:example2]
build_src_filter = -<*> +<main_example2.c>

[env:task2]
build_src_filter = -<*> +<main_task2_pb0.c>

[env:variant4]
build_src_filter = -<*> +<main_variant4.c>

[env:or4]
build_src_filter = -<*> +<main_or4.c>

[env:jk]
build_src_filter = -<*> +<main_jk.c>

[env:pa2pd]
build_src_filter = -<*> +<main_pa2pd.c>

[env:twoscomp]
build_src_filter = -<*> +<main_twoscomp.c>

[env:and]
build_src_filter = -<*> +<main_and.c>

[env:traffic]
build_src_filter = -<*> +<main_traffic.c>

[env:accum]
build_src_filter = -<*> +<main_accum.c>

[env:inverse]
build_src_filter = -<*> +<main_inverse.c>

[env:delay_half]
build_src_filter = -<*> +<main_delay_half.c>

[env:delay_x4]
build_src_filter = -<*> +<main_delay_x4.c>

[env:delay_05s]
build_src_filter = -<*> +<main_delay_05s.c>
