; Lab #3: генератор логических уровней, STM32F407VGT6 (Discovery board)
; Учебные примеры из методички (трек STM32F407) + 4 задания для самостоятельной работы.
; Вариант 4: задание 4, динамическое отображение S1-S4 на четырёхразрядном индикаторе.
; Плата disco_f407vg, фреймворк stm32cube, прямой доступ к регистрам (CMSIS).
;
;   pio run -e led        -> src/main_led.c       (пример 2.2: свитч PB0 зажигает LED PA0)
;   pio run -e display    -> src/main_display.c  (пример 3.2: код SW1-SW4 на 2 разрядах, 0-15)
;   pio run -e toggle     -> src/main_toggle.c   (задание 1: переключатель-инвертор с дебаунсом)
;   pio run -e modes      -> src/main_modes.c    (задание 2: режимы LED по SW1+SW2)
;   pio run -e counter    -> src/main_counter.c  (задание 3: счётчик нажатий 0-9)
;   pio run -e binary4    -> src/main_binary4.c  (задание 4 / вариант 4: биты S1-S4 на 4 разрядах)

[platformio]
default_envs = led

[env:led]
platform = ststm32
board = disco_f407vg
framework = stm32cube
build_src_filter = -<*> +<main_led.c>

[env:display]
platform = ststm32
board = disco_f407vg
framework = stm32cube
build_src_filter = -<*> +<main_display.c>

[env:toggle]
platform = ststm32
board = disco_f407vg
framework = stm32cube
build_src_filter = -<*> +<main_toggle.c>

[env:modes]
platform = ststm32
board = disco_f407vg
framework = stm32cube
build_src_filter = -<*> +<main_modes.c>

[env:counter]
platform = ststm32
board = disco_f407vg
framework = stm32cube
build_src_filter = -<*> +<main_counter.c>

[env:binary4]
platform = ststm32
board = disco_f407vg
framework = stm32cube
build_src_filter = -<*> +<main_binary4.c>
